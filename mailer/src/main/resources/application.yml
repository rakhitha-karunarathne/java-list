spring:
  application:
    name: mailer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/mailer}
    username: ${SPRING_DATASOURCE_USERNAME:mailer}
    password: ${SPRING_DATASOURCE_PASSWORD:mailer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

mailer:
  bootstrap:
    email: ${MAILER_BOOTSTRAP_EMAIL:admin@example.com}
    password: ${MAILER_BOOTSTRAP_PASSWORD:changeme}
  jwt:
    # Dev-only default (≥32 bytes). Override via env in real deploys.
    secret: ${MAILER_JWT_SECRET:dev-only-change-me-32chars-minimum!!}

