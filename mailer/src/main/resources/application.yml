spring:
  application:
    name: mailer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/mailer}
    username: ${SPRING_DATASOURCE_USERNAME:mailer}
    password: ${SPRING_DATASOURCE_PASSWORD:mailer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

mailer:
  public-base-url: ${MAILER_PUBLIC_BASE_URL:https://lists.example.com}
  # Used only to seed the first Admin when users table is empty (install).
  bootstrap:
    email: ${MAILER_BOOTSTRAP_EMAIL:admin@example.com}
    password: ${MAILER_BOOTSTRAP_PASSWORD:changeme}
  jwt:
    # Dev-only default (≥32 bytes). Override via env in real deploys. Never store in Parameters.
    secret: ${MAILER_JWT_SECRET:dev-only-change-me-32chars-minimum!!}
  opaque-token:
    # AES-GCM key material (≥32 bytes). Env only — never Parameters (AD-18 / C6).
    secret: ${MAILER_OPAQUE_TOKEN_SECRET:dev-only-opaque-token-32chars-min!!}
  # Fixed delay after each run finishes. Tests override these to stay quiet.
  send-queue:
    tick-ms: 60000
  bounce:
    poll-tick-ms: 60000
    correlate-tick-ms: 60000
  mts:
    poll-tick-ms: 60000
  poll:
    lock-timeout: 1h

