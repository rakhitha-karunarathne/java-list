# Epic 2 — Users & access. Tracer: install Admin + real JWT replaces stub.

[[entry]]
id = 1
type = "story"
title = "Install Admin and real JWT auth"
description = "Fresh install seeds initial Admin; user store with email+password; JWT Bearer replaces platform stub for /api."
verify = "Fresh compose/install yields Admin; email login returns JWT; stub env-only path retired for operator API."
covers = ["R1", "R3"]
after = ["epic-platform-kernel"]
hitl = true
risk = "high"

[[entry]]
