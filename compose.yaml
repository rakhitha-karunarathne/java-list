services:
  mariadb:
    image: mariadb:12.3.3
    environment:
      MARIADB_DATABASE: mailer
      MARIADB_USER: mailer
      MARIADB_PASSWORD: mailer
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb_data:/var/lib/mysql

  app:
    build:
      context: ./mailer
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/mailer
      SPRING_DATASOURCE_USERNAME: mailer
      SPRING_DATASOURCE_PASSWORD: mailer
      MAILER_SECRETS_KEY_1: dev-only-secrets-key-32chars-minimum!
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # Private-only DB UI — not for Cloudflare public path (architecture AD-7).
  phpmyadmin:
    image: phpmyadmin:5.2.2
    profiles: ["tools"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_USER: mailer
      PMA_PASSWORD: mailer
    ports:
      - "127.0.0.1:8081:80"

  # Fake SMTP+IMAP for automated/local tests (architecture AD-27).
  greenmail:
    image: greenmail/standalone:2.1.14
    profiles: ["test"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=mailer:mailer@localhost
    ports:
      - "3025:3025"
      - "3143:3143"

volumes:
  mariadb_data:
