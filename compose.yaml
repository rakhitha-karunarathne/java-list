services:
  mariadb:
    image: mariadb:12.3.3
    environment:
      MARIADB_DATABASE: mailer
      MARIADB_USER: mailer
      MARIADB_PASSWORD: mailer
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb_data:/var/lib/mysql

  app:
    build:
      context: ./mailer
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/mailer
      SPRING_DATASOURCE_USERNAME: mailer
      SPRING_DATASOURCE_PASSWORD: mailer
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  mariadb_data:
